# 本文件定义生产环境连接方式，所有凭证必须由环境变量提供，不设置可误用的默认值。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    # 所有生产迁移统一存放在该目录。
    locations: classpath:db/migration
    encoding: UTF-8
    # V5 在 V6/V7 已执行后才补入仓库，旧数据库缺少该版本；
    # 允许乱序执行以便把 V5 的注释迁移补齐，新库仍按版本号顺序执行。
    out-of-order: true
