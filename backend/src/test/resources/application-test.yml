# 本文件使用 MySQL 兼容模式的内存数据库运行单元测试，并执行与生产相同的 Flyway 迁移脚本，保证建表结果一致。
spring:
  datasource:
    url: jdbc:h2:mem:bugloop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    # H2 会跳过 V5 中的 MySQL 可执行注释，因此复用生产迁移目录。
    locations: classpath:db/migration
    encoding: UTF-8

bugloop:
  storage:
    # 测试附件写入构建目录，避免污染开发环境配置的真实附件根目录。
    root: target/test-attachments
