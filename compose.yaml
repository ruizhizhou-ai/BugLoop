# 本文件为 BugLoop 提供本地 MySQL 与 MinIO，并预留前后端容器化联调方式。
services:
  mysql:
    image: mysql:8.0
    container_name: bugloop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bugloop}
      MYSQL_USER: ${MYSQL_USERNAME:-bugloop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bugloop}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bugloop_root}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - bugloop-mysql-data:/var/lib/mysql
    healthcheck:
      # 只有 MySQL 真正接受连接后，后端容器才允许启动。
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: bugloop-minio
    restart: unless-stopped
    # server 数据目录；--console-address 固定控制台端口，避免随机端口。
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bugloop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bugloop_minio}
      TZ: Asia/Shanghai
    ports:
      # 9000 为 S3 API，9001 为 Web 控制台。
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - bugloop-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: bugloop-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bugloop}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-bugloop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bugloop}
      BUGLOOP_ADMIN_BOOTSTRAP_ENABLED: ${BUGLOOP_ADMIN_BOOTSTRAP_ENABLED:-true}
      BUGLOOP_STORAGE_ROOT: /var/lib/bugloop/attachments
    ports:
      - "8080:8080"
    volumes:
      - ./data/attachments:/var/lib/bugloop/attachments
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: bugloop-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  bugloop-mysql-data:
  bugloop-minio-data:

